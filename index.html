<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count With Me</title>
<style>
  :root {
    --bg: #fff8ec;
    --panel: #ffffff;
    --ink: #2b2a33;
    --muted: #6b6878;
    --accent: #ff7a59;
    --accent-ink: #ffffff;
    --frame: #fde7c8;
    --frame-line: #f3c98f;
    --chip: #f4efe6;
    --chip-on: #2b2a33;
    --counted: #7bd389;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1c24;
      --panel: #2a2933;
      --ink: #f4f2fa;
      --muted: #aaa6bb;
      --frame: #34323f;
      --frame-line: #4a475a;
      --chip: #34323f;
      --chip-on: #ffd36e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    display: flex;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  aside {
    width: 250px;
    flex: none;
    background: var(--panel);
    box-shadow: 2px 0 10px rgba(0,0,0,.06);
    padding: 16px 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 2;
  }
  h1 { margin: 0; font-size: 22px; text-align: center; }
  h2 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #num {
    width: 100%;
    font-size: 44px;
    font-weight: bold;
    text-align: center;
    padding: 4px 6px;
    border: 3px solid var(--frame-line);
    border-radius: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
  }
  #num:focus { outline: none; border-color: var(--accent); }
  #num::-webkit-inner-spin-button, #num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #num { -moz-appearance: textfield; }
  .steps { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .step {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 32px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1;
  }
  .step:active, .chip:active, .grp:active { transform: scale(.92); }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
  .chip {
    font-size: 28px;
    height: 52px;
    border-radius: 14px;
    border: none;
    background: var(--chip);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); box-shadow: 0 0 0 3px var(--accent); }
  .groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grp {
    height: 46px;
    border-radius: 12px;
    border: none;
    background: var(--chip);
    color: var(--ink);
    font-family: inherit;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
  }
  .grp.mix { grid-column: 1 / -1; font-size: 18px; }
  .grp[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 17px; color: var(--muted); cursor: pointer; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

  /* ---------- Board ---------- */
  main { flex: 1; min-width: 0; overflow: auto; position: relative; }
  .status {
    position: sticky; top: 0; left: 0;
    z-index: 1;
    background: var(--bg);
    text-align: center;
    padding: 12px 16px;
    font-size: 22px;
  }
  .status b { color: var(--accent); }
  .status .tapped { color: var(--muted); font-size: 18px; }
  #stage { position: relative; }
  .frame {
    position: absolute;
    background: var(--frame);
    border: 2px solid var(--frame-line);
    border-radius: 10px;
    animation: fade .4s ease both;
  }
  .frame > div {
    position: absolute;
    outline: 1px solid var(--frame-line);
    background-image:
      linear-gradient(to right, var(--frame-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--frame-line) 1px, transparent 1px);
    background-size: var(--s) var(--s);
  }
  .it {
    position: absolute; left: 0; top: 0;
    width: var(--s); height: var(--s);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--s) * .78);
    line-height: 1;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    border-radius: 30%;
  }
  #stage.moving .it { transition: transform .8s cubic-bezier(.5,0,.2,1); }
  .it > span { display: inline-block; animation: pop .35s cubic-bezier(.3,1.6,.6,1) both; }
  .it.counted { background: var(--counted); }
  .dot { width: 80%; height: 80%; border-radius: 50%; }
  .beach {
    background:
      radial-gradient(circle at 50% 50%, #fff 0 12%, transparent 13%),
      conic-gradient(#ff5a5f 0 60deg, #fff 0 120deg, #2f9bff 0 180deg, #fff 0 240deg, #ffd23f 0 300deg, #fff 0 360deg) !important;
    box-shadow: inset -3px -4px 0 rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.15);
  }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .it > span, .frame { animation: none; }
    #stage.moving .it { transition: none; }
  }

  /* Phones: slimmer sidebar */
  @media (max-width: 600px) {
    aside { width: 132px; padding: 12px 8px; gap: 14px; }
    h1 { font-size: 16px; }
    h2 { font-size: 11px; }
    #num { font-size: 26px; border-radius: 12px; padding: 4px 2px; }
    .step { width: 46px; height: 46px; font-size: 26px; }
    .steps { gap: 8px; }
    .chips { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .chip { height: 48px; font-size: 26px; }
    .groups { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .grp { height: 42px; font-size: 18px; }
    .grp.mix { font-size: 15px; }
    .toggle { font-size: 14px; }
    .status { font-size: 17px; padding: 10px 8px; }
  }
</style>
</head>
<body>
<aside>
  <h1>Count With Me</h1>
  <section>
    <h2><label for="num">Number</label></h2>
    <input id="num" type="number" inputmode="numeric" min="0" max="10000" value="7">
    <div class="steps">
      <button class="step" id="minus" aria-label="One less">−</button>
      <button class="step" id="plus" aria-label="One more">+</button>
    </div>
  </section>
  <section>
    <h2>Things</h2>
    <div class="chips" id="chips" role="group" aria-label="Choose what to count"></div>
  </section>
  <section>
    <h2>Make groups of</h2>
    <div class="groups" id="groups" role="group" aria-label="Arrange"></div>
  </section>
  <label class="toggle"><input type="checkbox" id="speak"> Count out loud</label>
</aside>
<main id="main">
  <div class="status" id="status"></div>
  <div id="stage"></div>
</main>

<script>
const MAX = 10000;
const PAD = 16;
const ITEMS = [
  { label: "Puppies", one: "puppy", emoji: "🐶" },
  { label: "Circles", one: "circle", dot: true },
  { label: "Beach balls", one: "beach ball", beach: true },
  { label: "Snowflakes", one: "snowflake", emoji: "❄️" },
  { label: "Stars", one: "star", emoji: "⭐" },
  { label: "Apples", one: "apple", emoji: "🍎" },
  { label: "Butterflies", one: "butterfly", emoji: "🦋" },
  { label: "Kittens", one: "kitten", emoji: "🐱" },
  { label: "Fish", one: "fish", emoji: "🐠" },
  { label: "Hearts", one: "heart", emoji: "💖" },
];
// Group size -> [columns, rows] of each group's box
const GROUPS = { 2: [2, 1], 3: [3, 1], 4: [2, 2], 5: [5, 1], 10: [5, 2], 100: [10, 10] };
const DOT_COLORS = ["#ff7a59", "#4fa3ff", "#7bd389", "#ffcc4d", "#b48cff"];

const $ = id => document.getElementById(id);
const numEl = $("num"), main = $("main"), stage = $("stage"), statusEl = $("status");

let item = ITEMS[0];
let mode = 0;            // 0 = scattered, otherwise the group size
let items = [];          // item elements, in the order they were added
let used = new Set();    // scatter slots that are taken
let cols = 0, cell = 0, lastWidth = 0;
let tapped = 0;

const sizeFor = () => (innerWidth <= 600 ? 34 : 46);
let S = sizeFor();

/* ---------- Sidebar controls ---------- */
for (const it of ITEMS) {
  const b = document.createElement("button");
  b.className = "chip";
  b.title = it.label;
  b.setAttribute("aria-label", it.label);
  b.setAttribute("aria-pressed", it === item);
  b.innerHTML = it.dot ? '<span class="dot" style="background:#4fa3ff;width:28px;height:28px"></span>'
    : it.beach ? '<span class="dot beach" style="width:30px;height:30px"></span>' : it.emoji;
  b.onclick = () => {
    item = it;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    for (const el of items) fillItem(el);
    paintDots();
    updateStatus();
    numEl.focus();
    numEl.select();
  };
  $("chips").appendChild(b);
}

const mixBtn = document.createElement("button");
mixBtn.className = "grp mix";
mixBtn.textContent = "🔀 Mix them up";
mixBtn.onclick = () => arrange(0, true);
$("groups").appendChild(mixBtn);
for (const g of Object.keys(GROUPS).map(Number)) {
  const b = document.createElement("button");
  b.className = "grp";
  b.dataset.g = g;
  b.textContent = g;
  b.setAttribute("aria-label", "Groups of " + g);
  b.onclick = () => arrange(g, false);
  $("groups").appendChild(b);
}
function markMode() {
  document.querySelectorAll(".grp").forEach(b =>
    b.setAttribute("aria-pressed", b === mixBtn ? mode === 0 : +b.dataset.g === mode));
}

function getN() {
  const n = parseInt(numEl.value, 10);
  return isNaN(n) || n < 0 ? 0 : Math.min(n, MAX);
}
$("minus").onclick = () => { numEl.value = Math.max(0, getN() - 1); setCount(getN()); say(getN()); };
$("plus").onclick = () => { numEl.value = Math.min(MAX, getN() + 1); setCount(getN()); say(getN()); };

let typeTimer;
numEl.addEventListener("input", () => {
  if (getN() !== +numEl.value && numEl.value !== "") numEl.value = getN();
  // A newly typed number starts scattered.
  if (mode !== 0) { mode = 0; markMode(); clearFrames(); }
  setCount(getN());
  clearTimeout(typeTimer);
  typeTimer = setTimeout(() => countAloud(getN()), 700);
});
numEl.addEventListener("keydown", e => { if (e.key === "Enter") numEl.blur(); });
$("speak").onchange = () => { if (!$("speak").checked) stopSpeaking(); };

// Tap an item to mark it as counted.
stage.addEventListener("click", e => {
  const el = e.target.closest(".it");
  if (!el) return;
  el.classList.toggle("counted");
  tapped += el.classList.contains("counted") ? 1 : -1;
  updateStatus();
});

addEventListener("resize", () => {
  clearTimeout(window._rt);
  window._rt = setTimeout(() => {
    // Only width matters; ignore height changes from on-screen keyboards.
    if (main.clientWidth === lastWidth && sizeFor() === S) return;
    S = sizeFor();
    rescatterAll();
    layout();
  }, 150);
});

/* ---------- Items ---------- */
function fillItem(el) {
  el.innerHTML = item.dot ? '<span class="dot"></span>'
    : item.beach ? '<span class="dot beach"></span>' : "<span>" + item.emoji + "</span>";
}
function paintDots() {
  if (!item.dot) return;
  items.forEach((el, i) => {
    const k = mode ? Math.floor(i / mode) : i;
    el.firstChild.style.background = DOT_COLORS[k % DOT_COLORS.length];
  });
}

/* ---------- Scatter: a jittered grid of slots, so items never overlap ---------- */
function measure() {
  lastWidth = main.clientWidth;
  stage.style.setProperty("--s", S + "px");
  cell = Math.round(S * 1.3);
  cols = Math.max(1, Math.floor((lastWidth - 2 * PAD) / cell));
}
function visibleRows() {
  return Math.max(1, Math.floor((main.clientHeight - statusEl.offsetHeight - 2 * PAD) / cell));
}
function scatterRows(n) {
  const spread = n < 300 ? 2.2 : 1.35;   // leave room so it looks scattered, not packed
  return Math.max(visibleRows(), Math.ceil(n * spread / cols));
}
function takeSlot(n) {
  const total = scatterRows(n) * cols;
  for (let tries = 0; tries < 60; tries++) {
    const s = Math.floor(Math.random() * total);
    if (!used.has(s)) { used.add(s); return s; }
  }
  for (let s = 0; ; s++) if (!used.has(s)) { used.add(s); return s; }
}
function rescatterAll() {
  measure();
  used.clear();
  for (const el of items) {
    el._slot = takeSlot(items.length);
  }
}

/* ---------- Changing the count ---------- */
function setCount(n) {
  if (!cols) measure();
  // Remove extras from the end.
  while (items.length > n) {
    const el = items.pop();
    used.delete(el._slot);
    if (el.classList.contains("counted")) tapped--;
    el.remove();
  }
  // Add new ones, popping in one after another.
  const add = n - items.length;
  const step = Math.min(70, 1500 / Math.max(1, add));
  const frag = document.createDocumentFragment();
  for (let k = 0; k < add; k++) {
    const el = document.createElement("div");
    el.className = "it";
    el._jx = Math.random();
    el._jy = Math.random();
    el._slot = takeSlot(n);
    fillItem(el);
    el.firstChild.style.animationDelay = (k * step) + "ms";
    items.push(el);
    frag.appendChild(el);
  }
  stage.appendChild(frag);
  if (add < 0 || add > 0) layout();
  updateStatus();
}

/* ---------- Arranging ---------- */
function arrange(g, reshuffle) {
  mode = g;
  markMode();
  if (reshuffle) rescatterAll();
  // Slide items to their new spots (skipped for huge counts to stay smooth).
  if (items.length <= 3000) {
    stage.classList.add("moving");
    clearTimeout(window._mt);
    window._mt = setTimeout(() => stage.classList.remove("moving"), 900);
  }
  layout();
  updateStatus();
}

function clearFrames() { stage.querySelectorAll(".frame").forEach(f => f.remove()); }

function layout() {
  if (!cols) measure();
  const W = lastWidth - 2 * PAD;
  clearFrames();
  if (mode === 0) {
    const off = PAD + Math.max(0, (W - cols * cell) / 2);
    let maxRow = 0;
    for (const el of items) {
      const r = Math.floor(el._slot / cols), c = el._slot % cols;
      maxRow = Math.max(maxRow, r);
      const x = off + c * cell + el._jx * (cell - S);
      const y = PAD + r * cell + el._jy * (cell - S);
      el.style.transform = `translate(${x}px, ${y}px)`;
    }
    stage.style.width = "";
    stage.style.height = (Math.max(scatterRows(items.length), maxRow + 1) * cell + 2 * PAD) + "px";
  } else {
    const [c, r] = GROUPS[mode];
    const pad = 6, gap = 14;
    const fw = c * S + 2 * pad + 4, fh = r * S + 2 * pad + 4;   // +4 for the border
    const perRow = Math.max(1, Math.floor((W + gap) / (fw + gap)));
    const rowW = perRow * (fw + gap) - gap;
    const offX = PAD + Math.max(0, (W - rowW) / 2);
    const nFrames = Math.ceil(items.length / mode);
    const frag = document.createDocumentFragment();
    for (let k = 0; k < nFrames; k++) {
      const f = document.createElement("div");
      f.className = "frame";
      f.style.left = (offX + (k % perRow) * (fw + gap)) + "px";
      f.style.top = (PAD + Math.floor(k / perRow) * (fh + gap)) + "px";
      f.style.width = fw + "px";
      f.style.height = fh + "px";
      const inner = document.createElement("div");
      inner.style.cssText = `left:${pad}px;top:${pad}px;width:${c * S}px;height:${r * S}px`;
      f.appendChild(inner);
      frag.appendChild(f);
    }
    stage.prepend(frag);
    items.forEach((el, i) => {
      const k = Math.floor(i / mode), j = i % mode;
      const x = offX + (k % perRow) * (fw + gap) + 2 + pad + (j % c) * S;
      const y = PAD + Math.floor(k / perRow) * (fh + gap) + 2 + pad + Math.floor(j / c) * S;
      el.style.transform = `translate(${x}px, ${y}px)`;
    });
    stage.style.width = Math.max(lastWidth, rowW + 2 * PAD) + "px";
    stage.style.height = (Math.ceil(nFrames / perRow) * (fh + gap) - gap + 2 * PAD) + "px";
  }
  paintDots();
}

/* ---------- Status line ---------- */
function plural(k, word) { return k.toLocaleString() + " " + word + (k === 1 ? "" : "s"); }
function updateStatus() {
  const n = items.length;
  if (n === 0) { statusEl.innerHTML = "Type a number to fill the board!"; return; }
  const name = n === 1 ? item.one : item.label.toLowerCase();
  let html = `<b>${n.toLocaleString()}</b> ${name}`;
  if (mode === 0 || mode === 10 || mode === 100) {
    if (n >= 10) {
      const th = Math.floor(n / 1000), h = Math.floor(n % 1000 / 100), t = Math.floor(n % 100 / 10), o = n % 10;
      const parts = [];
      if (th) parts.push(plural(th, "thousand"));
      if (h) parts.push(plural(h, "hundred"));
      if (t) parts.push(plural(t, "ten"));
      if (o) parts.push(plural(o, "one"));
      html += " = " + parts.join(" + ");
    }
  } else {
    const groups = Math.floor(n / mode), left = n % mode;
    const parts = [];
    if (groups) parts.push(`${groups.toLocaleString()} group${groups === 1 ? "" : "s"} of ${mode}`);
    if (left) parts.push(`${left} more`);
    html += " = " + parts.join(" + ");
  }
  if (tapped > 0) html += ` <span class="tapped">· you've tapped ${tapped.toLocaleString()}</span>`;
  statusEl.innerHTML = html;
}

/* ---------- Counting out loud ---------- */
function stopSpeaking() { if ("speechSynthesis" in window) speechSynthesis.cancel(); }
function say(n) {
  if (!$("speak").checked || !("speechSynthesis" in window)) return;
  stopSpeaking();
  speechSynthesis.speak(new SpeechSynthesisUtterance(String(n)));
}
function countAloud(n) {
  if (!$("speak").checked || !("speechSynthesis" in window)) return;
  stopSpeaking();
  if (n > 30) return say(n);   // counting every number is fun up to 30
  for (let i = 1; i <= n; i++) {
    const u = new SpeechSynthesisUtterance(String(i));
    u.rate = 1.1;
    speechSynthesis.speak(u);
  }
}

markMode();
setCount(getN());
</script>
</body>
</html>
