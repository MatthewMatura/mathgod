<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count With Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff1a8;
    --bg2: #ffd1e6;
    --bg3: #bdeeff;
    --panel: rgba(255, 255, 255, .9);
    --ink: #3b2466;
    --muted: #7b6a9b;
    --accent: #ff4f8b;
    --accent-ink: #ffffff;
    --purple: #7c4dff;
    --sun: #ffc93c;
    --sky: #2fb8ff;
    --mint: #20c997;
    --orange: #ff8a3d;
    --good: #12b76a;
    --bad: #ef4565;
    --frame: #fff4c2;
    --frame-line: #ffc93c;
    --counted: #7be495;
    --hi: #ffb000;
    --side1: #7c4dff;
    --side2: #ff4f8b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #2b1d5c;
      --bg2: #4a1f5e;
      --bg3: #123a5e;
      --panel: rgba(40, 28, 78, .92);
      --ink: #fff7fb;
      --muted: #cbbdf0;
      --frame: #3d2f72;
      --frame-line: #ffc93c;
      --side1: #4b2aa8;
      --side2: #a8235e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    color: var(--ink);
    font-family: "Fredoka", "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    display: flex;
    overflow: hidden;
  }
  button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  /* chunky, squishy buttons */
  .home-btn, .step, .chip, .grp, .pbtn, .pad button, .arrow, .equals, .card {
    transition: transform .12s ease, box-shadow .12s ease, filter .12s;
  }
  .home-btn:active, .step:active, .chip:active, .grp:active, .pbtn:active, .pad button:active, .arrow:active, .equals:active {
    transform: translateY(3px) scale(.95);
    box-shadow: 0 1px 0 rgba(0,0,0,.18) !important;
  }
  @media (hover: hover) {
    .step:hover, .chip:hover, .grp:hover, .pbtn:hover, .pad button:hover, .arrow:hover, .equals:hover, .home-btn:hover { filter: brightness(1.06); transform: translateY(-2px); }
  }

  /* ---------- Sidebar ---------- */
  aside {
    width: 250px;
    flex: none;
    background: linear-gradient(180deg, var(--side1), var(--side2));
    color: #fff;
    box-shadow: 4px 0 18px rgba(80, 30, 140, .25);
    padding: 14px 14px 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 2;
  }
  .home-btn {
    height: 44px; border: none; border-radius: 999px;
    background: #fff; color: var(--purple);
    font-size: 17px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.18);
  }
  #actTitle { margin: 0; font-size: 24px; text-align: center; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.85); font-weight: 600; }
  #actControls { display: flex; flex-direction: column; gap: 16px; }
  .numbox {
    width: 100%;
    font-size: 44px; font-weight: 700;
    text-align: center;
    padding: 4px 6px;
    border: 4px solid var(--sun);
    border-radius: 20px;
    background: #fff; color: #3b2466;
    font-family: inherit;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  .numbox:focus, .tile:focus { outline: none; border-color: var(--sky); }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .steps { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
  .step {
    width: 58px; height: 58px; border-radius: 50%; border: none;
    background: var(--sun); color: #3b2466;
    font-size: 34px; font-weight: 700; cursor: pointer; line-height: 1;
    box-shadow: 0 5px 0 #d99a00;
  }
  .step + .step { background: var(--mint); color: #fff; box-shadow: 0 5px 0 #0f9670; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
  .chip {
    font-size: 28px; height: 52px;
    border-radius: 16px; border: none;
    background: rgba(255,255,255,.9);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  .chip[aria-pressed="true"] { background: var(--sun); box-shadow: 0 4px 0 #d99a00, 0 0 0 3px #fff; animation: wiggle .5s; }
  .groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grp {
    min-height: 46px; padding: 4px 6px;
    border-radius: 16px; border: none;
    background: rgba(255,255,255,.92); color: #3b2466;
    font-weight: 700; font-size: 19px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  .grp.mix { grid-column: 1 / -1; font-size: 18px; }
  .groups.list { grid-template-columns: 1fr !important; }
  .groups.list .grp { text-align: left; padding-left: 12px; font-size: 17px; }
  .grp[aria-pressed="true"] { background: var(--sun); color: #3b2466; box-shadow: 0 4px 0 #d99a00, 0 0 0 3px #fff; }
  .grp.wide { width: 100%; font-size: 18px; }
  .grp.wide + .grp.wide { margin-top: 10px; }
  .grp.go { background: linear-gradient(135deg, #ffd23f, #ff9a3d); color: #3b2466; box-shadow: 0 4px 0 #d9731a; }
  .speed { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 22px; }
  .speed input { flex: 1; min-width: 0; accent-color: var(--sun); height: 28px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 17px; color: #fff; cursor: pointer; font-weight: 600; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--sun); flex: none; }
  .hint { margin: 8px 0 0; color: rgba(255,255,255,.9); font-size: 14px; line-height: 1.35; }

  /* ---------- Main area ---------- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .top { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px 4px; position: relative; z-index: 1; }
  .prompt {
    flex: 1; min-width: 0; min-height: 44px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 8px 12px;
    text-align: center;
    font-size: 24px; font-weight: 600;
    line-height: 1.35;
  }
  .prompt b { color: var(--accent); font-size: 1.15em; }
  .prompt .tapped { color: var(--muted); font-size: 18px; }
  .prompt .line { width: 100%; animation: rise .35s ease backwards; }
  .prompt .story { max-width: 780px; margin: 0 auto; }
  .prompt .row { width: 100%; display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: center; align-items: center; animation: rise .35s ease backwards; }
  .prompt .explain { display: block; font-size: 19px; font-weight: 500; max-width: 760px; margin: 0 auto;
    background: var(--panel); border-radius: 18px; padding: 8px 14px; box-shadow: 0 4px 14px rgba(80,30,140,.12); }
  .prompt .explain b { font-size: 1.05em; }
  .prompt .cheer { font-weight: 700; color: var(--good); font-size: 22px; }
  .score {
    flex: none; font-size: 20px; font-weight: 700; white-space: nowrap;
    background: linear-gradient(135deg, #ffe066, #ffb703); color: #3b2466;
    padding: 6px 14px; border-radius: 999px; box-shadow: 0 4px 0 #d99a00;
  }
  .score.bump { animation: bump .6s cubic-bezier(.3,1.8,.5,1); }
  #wrap { flex: 1; min-height: 0; position: relative; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; cursor: pointer; z-index: 1; }
  /* floating bubbles behind the board */
  .sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .sky span {
    position: absolute; bottom: -120px; border-radius: 50%; opacity: .35;
    animation: floatUp linear infinite;
  }
  .banner {
    position: absolute; left: 50%; top: 10px; z-index: 3;
    transform: translate(-50%, 0) scale(.4) rotate(-6deg);
    opacity: 0; pointer-events: none;
    padding: 14px 30px; border-radius: 28px;
    font-size: 36px; font-weight: 700; text-align: center; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.18);
    box-shadow: 0 12px 30px rgba(80,30,140,.3);
    transition: opacity .25s, transform .45s cubic-bezier(.3,1.8,.5,1);
    max-width: 92%;
  }
  .banner.show { opacity: 1; transform: translate(-50%, 0) scale(1) rotate(0); }
  .banner.good { background: linear-gradient(135deg, #20c997, #12b76a 50%, #2fb8ff); }
  .banner.soft { background: linear-gradient(135deg, #ff9a3d, #ff4f8b); }

  /* Prompt buttons and equation tiles */
  .pbtn {
    min-height: 52px; padding: 0 22px;
    border-radius: 999px; border: none;
    background: #fff; color: var(--purple);
    font-size: 22px; font-weight: 700; cursor: pointer;
    box-shadow: 0 5px 0 rgba(80,30,140,.25);
  }
  .pbtn:nth-child(3n+1) { background: var(--sky); color: #fff; box-shadow: 0 5px 0 #1489c9; }
  .pbtn:nth-child(3n+2) { background: var(--purple); color: #fff; box-shadow: 0 5px 0 #5428c9; }
  .pbtn:nth-child(3n) { background: var(--mint); color: #fff; box-shadow: 0 5px 0 #0f9670; }
  .pbtn.go { background: linear-gradient(135deg, #ff6fa3, #ff4f8b); color: #fff; box-shadow: 0 5px 0 #c92a63; animation: nudge 1.6s ease-in-out infinite; }
  .eq { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .num { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .arrow {
    width: 70px; height: 32px; border: none; border-radius: 999px;
    background: #fff; color: var(--purple); font-size: 16px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(80,30,140,.25);
  }
  .tile {
    min-width: 84px; height: 66px; padding: 0 8px;
    font-size: 40px; font-weight: 700; text-align: center;
    border-radius: 20px; border: 4px solid var(--sun);
    background: #fff; color: #3b2466; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; flex-direction: column; line-height: 1;
    box-shadow: 0 5px 0 rgba(80,30,140,.18);
  }
  input.tile { width: 84px; }
  .tile.a { border-color: #ff7a59; }
  .tile.b { border-color: #4fa3ff; }
  .tile.res { border-style: dashed; border-color: var(--purple); }
  .tile small { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .tile.right { border-style: solid; border-color: var(--good); color: var(--good); background: #e3fbef; animation: bump .6s cubic-bezier(.3,1.8,.5,1); }
  .tile.wrong { border-style: solid; border-color: var(--bad); color: var(--bad); background: #ffe8ed; animation: shake .45s; }
  .opsign { font-size: 44px; font-weight: 700; color: var(--purple); }
  .equals {
    width: 66px; height: 66px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff6fa3, #7c4dff); color: #fff;
    font-size: 42px; font-weight: 700; cursor: pointer; line-height: 1;
    box-shadow: 0 5px 0 #5428c9;
    animation: glow 1.8s ease-in-out infinite;
  }
  .seq { font-weight: 700; color: var(--accent); }

  /* Number pad: a rainbow of chunky buttons */
  .pad {
    flex: none; position: relative; z-index: 1;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 8px; padding: 10px 12px 14px;
    background: var(--panel); box-shadow: 0 -4px 16px rgba(80,30,140,.12);
  }
  .pad[hidden] { display: none; }
  .pad.off button { opacity: .35; pointer-events: none; }
  .pad .shown {
    min-width: 110px; height: 56px; padding: 0 12px;
    border-radius: 18px; border: 4px dashed var(--purple);
    font-size: 34px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    background: #fff; color: #3b2466;
  }
  .pad.bare .shown { display: none; }
  .pad button {
    width: 56px; height: 56px; border-radius: 18px; border: none;
    font-size: 28px; font-weight: 700; cursor: pointer; color: #fff;
    text-shadow: 0 1px 0 rgba(0,0,0,.2);
  }
  .pad button:nth-of-type(6n+1) { background: #ff5d8f; box-shadow: 0 4px 0 #c92a63; }
  .pad button:nth-of-type(6n+2) { background: #ff9a3d; box-shadow: 0 4px 0 #d9731a; }
  .pad button:nth-of-type(6n+3) { background: #ffc93c; box-shadow: 0 4px 0 #d99a00; color: #3b2466; text-shadow: none; }
  .pad button:nth-of-type(6n+4) { background: #20c997; box-shadow: 0 4px 0 #0f9670; }
  .pad button:nth-of-type(6n+5) { background: #2fb8ff; box-shadow: 0 4px 0 #1489c9; }
  .pad button:nth-of-type(6n)   { background: #9b6bff; box-shadow: 0 4px 0 #5428c9; }
  .pad button[data-d="back"] { background: #fff; color: var(--purple); box-shadow: 0 4px 0 rgba(80,30,140,.25); text-shadow: none; }
  .pad .ok { width: 84px; background: linear-gradient(135deg, #20c997, #12b76a) !important; box-shadow: 0 4px 0 #0b7d4a !important; }

  /* Home screen */
  .home {
    position: fixed; inset: 0; z-index: 10;
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
    overflow-y: auto; padding: 24px 16px 32px;
  }
  .home[hidden] { display: none; }
  .home .sky { position: fixed; }
  .home h1 { position: relative; text-align: center; font-size: 54px; margin: 4px 0 4px; letter-spacing: 1px; }
  .home h1 span { display: inline-block; animation: hop 2.4s ease-in-out infinite; text-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .home p.sub { position: relative; text-align: center; color: var(--ink); font-size: 22px; margin: 0 0 22px; font-weight: 600; }
  .cards { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; max-width: 1040px; margin: 0 auto; }
  .card {
    border: none; border-radius: 26px; padding: 18px; text-align: left; cursor: pointer;
    color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.15);
    box-shadow: 0 6px 0 rgba(0,0,0,.15), 0 10px 24px rgba(80,30,140,.18);
    animation: popIn .5s cubic-bezier(.3,1.6,.5,1) backwards;
  }
  .card:hover { transform: translateY(-4px) rotate(-1.5deg) scale(1.03); }
  .card:active { transform: scale(.96); }
  .card .ic {
    font-size: 44px; line-height: 1; width: 72px; height: 72px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.9); text-shadow: none;
    animation: bob 2.2s ease-in-out infinite;
  }
  .card .t { font-size: 24px; font-weight: 700; margin: 12px 0 4px; }
  .card .d { font-size: 15px; line-height: 1.35; opacity: .95; font-weight: 500; }
  .card:nth-child(10n+1) { background: linear-gradient(135deg, #ff6fa3, #ff4f8b); }
  .card:nth-child(10n+2) { background: linear-gradient(135deg, #9b6bff, #6a3df0); }
  .card:nth-child(10n+3) { background: linear-gradient(135deg, #3fd0ff, #1e9bff); }
  .card:nth-child(10n+4) { background: linear-gradient(135deg, #ffcf3f, #ff9a3d); }
  .card:nth-child(10n+5) { background: linear-gradient(135deg, #2fe0b0, #12b76a); }
  .card:nth-child(10n+6) { background: linear-gradient(135deg, #ff8a5c, #ff4f5e); }
  .card:nth-child(10n+7) { background: linear-gradient(135deg, #c86bff, #ff4fbf); }
  .card:nth-child(10n+8) { background: linear-gradient(135deg, #4dd9c4, #2f8bff); }
  .card:nth-child(10n+9) { background: linear-gradient(135deg, #ffb13f, #ff6f3d); }
  .card:nth-child(10n)   { background: linear-gradient(135deg, #7c8bff, #9b4dff); }

  /* Animations */
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-14px) rotate(-6deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.5) translateY(30px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  @keyframes glow { 0%, 100% { box-shadow: 0 5px 0 #5428c9, 0 0 0 0 rgba(255,79,139,.5); } 50% { box-shadow: 0 5px 0 #5428c9, 0 0 0 10px rgba(255,79,139,0); } }
  @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes floatUp { from { transform: translateY(0) translateX(0); } 50% { transform: translateY(-60vh) translateX(30px); } to { transform: translateY(-130vh) translateX(-20px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* Phones */
  /* Top bar and pinned controls only show on phones */
  .mbar, #mpin, .drawer-close, .scrim { display: none; }

  /* Phones and small tablets: settings live in a slide-out panel; the problem gets the whole screen */
  @media (max-width: 700px) {
    aside {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: min(310px, 86vw);
      transform: translateX(-105%);
      transition: transform .3s cubic-bezier(.3,1.2,.5,1);
      z-index: 30;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    body.drawer-open aside { transform: none; }
    .drawer-close {
      display: block; height: 44px; border: none; border-radius: 999px;
      background: var(--sun); color: #3b2466; font-size: 18px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 0 #d99a00;
    }
    body.drawer-open .scrim { display: block; position: fixed; inset: 0; background: rgba(30, 10, 60, .45); z-index: 25; }

    .mbar {
      display: flex; align-items: center; gap: 8px; flex: none;
      padding: max(8px, env(safe-area-inset-top)) 10px 8px;
      background: linear-gradient(90deg, var(--side1), var(--side2));
      color: #fff; box-shadow: 0 4px 14px rgba(80,30,140,.25);
      position: relative; z-index: 2;
    }
    .mbar button {
      height: 40px; border: none; border-radius: 999px; cursor: pointer;
      background: #fff; color: var(--purple); font-weight: 700; font-size: 16px;
      box-shadow: 0 3px 0 rgba(0,0,0,.18);
    }
    .mb-home { width: 44px; font-size: 20px !important; }
    .mb-title { flex: 1; min-width: 0; text-align: center; font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
    .mb-opts { width: 44px; font-size: 22px !important; }
    .mb-title { text-align: left; font-size: 19px; }
    .mb-score { font-size: 16px; padding: 6px 12px; }
    .top .score { display: none; }

    #mpin:not(:empty) { display: flex; justify-content: center; padding: 8px 10px 0; position: relative; z-index: 1; }
    #mpin section { display: flex; align-items: center; gap: 10px; }
    #mpin h2 { display: none; }
    #mpin .numbox { width: 140px; font-size: 32px; padding: 2px 4px; }
    #mpin .steps { margin: 0; }
    #mpin .step { width: 50px; height: 50px; font-size: 28px; }

    .top { padding: 8px 8px 2px; gap: 6px; }
    .prompt { font-size: 18px; gap: 6px 8px; }
    .prompt .explain { font-size: 15px; padding: 6px 10px; }
    .prompt .cheer { font-size: 17px; }
    .score { font-size: 15px; padding: 4px 10px; }
    .pbtn { min-height: 44px; padding: 0 16px; font-size: 17px; }
    .tile { min-width: 56px; height: 56px; font-size: 30px; border-radius: 16px; border-width: 3px; padding: 0 4px; }
    input.tile { width: 56px; }
    .arrow { width: 56px; height: 28px; font-size: 13px; }
    .opsign { font-size: 28px; }
    .equals { width: 52px; height: 52px; font-size: 32px; }
    .eq { gap: 6px; flex-wrap: nowrap; }

    /* number pad: two tidy rows (1-5 ⌫ / 6-0 ✓) */
    .pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 8px 8px max(10px, env(safe-area-inset-bottom)); }
    .pad .shown { grid-column: 1 / -1; order: 0; min-width: 0; height: 42px; font-size: 26px; }
    .pad button { width: auto; height: 50px; font-size: 24px; }
    .pad button[data-d="1"], .pad button[data-d="2"], .pad button[data-d="3"], .pad button[data-d="4"], .pad button[data-d="5"] { order: 1; }
    .pad button[data-d="back"] { order: 2; }

<script>

  { label: "Circles", one: "circle", dot: true },
  { label: "Beach balls", one: "beach ball", beach: true },
  { label: "Snowflakes", one: "snowflake", emoji: "❄️" },
  { label: "Stars", one: "star", emoji: "⭐" },
  { label: "Apples", one: "apple", emoji: "🍎" },
  { label: "Butterflies", one: "butterfly", emoji: "🦋" },
  { label: "Kittens", one: "kitten", emoji: "🐱" },

  return slots.map(k => ({ x: ox + (k % cols) * c + Math.random() * (c - s), y: oy + Math.floor(k / cols) * c + Math.random() * (c - s) }));

const boxShape = g => GROUPS[g] || [Math.min(g, 5), Math.ceil(g / 5)];
const groupDims = s => ({ pad: Math.max(1, s * 0.13), gap: Math.max(3, s * 0.3), bw: Math.max(1, Math.min(3, s * 0.06)) });

// Largest size at which n items in boxes of g fit inside r.
function fitGroups(r, n, g, top = MAXS(), { nf, below = 0 } = {}) {
  const [c, rw] = boxShape(g);
  nf = nf ?? Math.max(1, Math.ceil(n / g));
  for (let s = top; s > 2; s -= 0.25) {
    const { pad, gap, bw } = groupDims(s);
    const fw = c * s + 2 * (pad + bw), fh = rw * s + 2 * (pad + bw) + below;

  }

}
function groupLayout(r, n, g, s, { nf, below = 0, vcenter = true } = {}) {
  const [c, rw] = boxShape(g);
  nf = nf ?? Math.max(1, Math.ceil(n / g));
  const { pad, gap, bw } = groupDims(s);
  const fw = c * s + 2 * (pad + bw), boxH = rw * s + 2 * (pad + bw), fh = boxH + below;
  const per = Math.max(1, Math.min(nf, Math.floor((r.w + gap) / (fw + gap))));
  const rows = Math.ceil(nf / per);
  const totW = per * (fw + gap) - gap, totH = rows * (fh + gap) - gap;
  const ox = r.x + Math.max(0, (r.w - totW) / 2);

  const boxes = [];
  for (let k = 0; k < nf; k++) {
    const x = ox + (k % per) * (fw + gap), y = oy + Math.floor(k / per) * (fh + gap);
    boxes.push({ x, y, w: fw, h: boxH, bw, cells: { c, r: rw, s, ox: x + bw + pad, oy: y + bw + pad } });
  }
  const spot = i => {
    const b = boxes[Math.floor(i / g)], j = i % g;

}
function fitGrid(r, rows, cols, top = MAXS(), gf = 0.18) {

// Slide (or place) a list of sprites into boxes of ten. Returns how long the slide takes.
function arrangeTens(list, anim, rect = board()) {
  const n = list.length;
  const s = fitGroups(rect, n, 10);
  E.S = s;
  const G = groupLayout(rect, n, 10, s);
  E.frames = [];
  G.boxes.forEach(b => frame(anim ? { ...b, delay: 250 } : b));
  const st = Math.min(25, 400 / Math.max(1, n));
  list.forEach((sp, i) => { const p = G.spot(i); moveTo(sp, p.x, p.y, anim ? i * st : 0, anim ? MOVE_MS : 0); });

}
function scatterList(list, rect = board()) {
  const s = fitScatter(rect, list.length);
  E.S = s;
  scatterSpots(rect, list.length, s).forEach((p, i) => moveTo(list[i], p.x, p.y, 0, 0));
}
// Scatter a list inside r, keeping each item's spot when the list grows or shrinks.
function scatterKeep(list, r, s) {
  const c = s * 1.3, cols = Math.max(1, Math.floor(r.w / c)), rows = Math.max(1, Math.floor(r.h / c));
  const key = cols + "x" + rows, total = cols * rows, used = new Set();
  for (const sp of list) {
    if (sp.scKey === key && !used.has(sp.scSlot)) used.add(sp.scSlot); else sp.scKey = null;
  }
  for (const sp of list) {
    if (sp.scKey === key) continue;
    let k, tries = 0;
    do k = Math.floor(Math.random() * total); while (used.has(k) && ++tries < 60);
    if (used.has(k)) for (k = 0; k < total - 1 && used.has(k); k++);
    used.add(k);
    sp.scSlot = k; sp.scKey = key; sp.jx = Math.random(); sp.jy = Math.random();
  }
  const ox = r.x + (r.w - cols * c) / 2, oy = r.y + (r.h - rows * c) / 2;
  return list.map(sp => ({ x: ox + (sp.scSlot % cols) * c + sp.jx * (c - s), y: oy + Math.floor(sp.scSlot / cols) * c + sp.jy * (c - s) }));

// Make each item bounce in turn, calling onTick(1..n), then done().
function countUp(list, { delay = 0, step, onTick, done } = {}) {
  const n = list.length;

  list.forEach((sp, i) => pulse(sp, delay + i * step));
  if (onTick) for (let i = 0; i < n; i++) later(() => onTick(i + 1), delay + i * step);
  later(() => done && done(), delay + n * step + 250);
}

const talkOn = () => $("speak").checked && "speechSynthesis" in window;
const plainText = s => s.replace(/<[^>]+>/g, " ").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}️]/gu, "").replace(/\s+/g, " ").trim();
function say(text, queue = false) {
  if (!talkOn()) return;
  if (!queue) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plainText(text));
  u.rate = 1;
  speechSynthesis.speak(u);
}
function stopSpeaking() { if ("speechSynthesis" in window) speechSynthesis.cancel(); }
function countAloud(n) {
  if (!talkOn()) return;
  stopSpeaking();
  if (n > 30 || n < 1) return say(String(n));
  for (let i = 1; i <= n; i++) { const u = new SpeechSynthesisUtterance(String(i)); u.rate = 1.1; speechSynthesis.speak(u); }
}

let score = 0;
function addStar() {
  score++;
  for (const el of [$("score"), $("mScore")]) {
    el.textContent = "⭐ " + score;
    el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  }
}
let bannerTimer;
function banner(msg, kind = "good") {

}

// Little sounds made on the fly: a rising chime for right, a gentle "uh-oh" for not quite.
let audio = null;
function tone(freq, t0, dur, type, vol) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(audio.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sound(kind) {
  if (!$("sounds").checked) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime + 0.02;
    if (kind === "good") {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.09, 0.32, "triangle", 0.22));
      tone(1318.5, t + 0.36, 0.55, "sine", 0.14);
      tone(1567.98, t + 0.42, 0.5, "sine", 0.1);
    } else {
      tone(392, t, 0.3, "sine", 0.25);
      tone(311.13, t + 0.24, 0.5, "sine", 0.25);
    }
  } catch (e) { /* no sound available */ }
}

const padEl = $("pad");

padEl.innerHTML = '<div class="shown" id="padShown">?</div>' +
  [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => `<button data-d="${d}">${d}</button>`).join("") +

padEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) padKey(b.dataset.d); });
function padKey(d) {
  if (!padFn) return;

  else if (d === "ok") { if (padVal !== "") padFn(+padVal); else if (padEmptyOk) padFn(null); return; }

}

  if (padEl.hidden || !padFn) return;

}
function choice(title, opts, value, fn, cols) {

  },
  // A jittered grid of slots for scattering, so items never overlap.
  setGrid(s) {
    const r = board(), c = s * 1.3;
    const cols = Math.max(1, Math.floor(r.w / c)), rows = Math.max(1, Math.floor(r.h / c));
    if (cols === this.cols && rows === this.rows) return;
    const oc = this.cols, or = this.rows;
    this.cols = cols; this.rows = rows;
    this.used.clear();
    for (const sp of this.items) {   // keep each item near the same spot in the new grid
      if (!oc) { sp.slot = this.takeSlot(); continue; }
      const row = Math.min(rows - 1, Math.floor((Math.floor(sp.slot / oc) + .5) * rows / or));

  },

    const gone = [];

      const sp = this.items.pop();
      this.used.delete(sp.slot);
      if (sp.counted) this.tapped--;
      gone.push(sp);
    }
    if (gone.length) removeSprites(gone);
    const add = n - this.items.length;
    const st = Math.min(60, 900 / Math.max(1, add));
    this.setGrid(this.chooseSize(n));
    for (let k = 0; k < add; k++) {
      const sp = sprite(0, 0, { delay: k * st });

    const put = (sp, x, y) => {

};

  },
  renderEq() {
    const sign = { "+": "+", "−": "−", "×": "×", "÷": "÷" }[this.op];
    const num = (k, cls) => `<div class="num">
        <button class="arrow" data-k="${k}" data-d="1" aria-label="More">▲</button>
        <input class="tile ${cls}" id="eq${k}" type="number" inputmode="numeric" value="${this.vals[this.op][k]}" aria-label="Number ${k + 1}">
        <button class="arrow" data-k="${k}" data-d="-1" aria-label="Less">▼</button></div>`;
    setPrompt(`<div class="eq">${num(0, this.op === "+" || this.op === "−" ? "a" : "")}<span class="opsign">${sign}</span>${num(1, this.op === "+" ? "b" : "")}
      <button class="equals" id="eqGo" aria-label="Equals, check my answer">=</button><div class="tile res" id="eqR" aria-label="Your answer">?</div></div>`);
    document.querySelectorAll(".eq .arrow").forEach(b => b.onclick = () => this.change(+b.dataset.k, this.vals[this.op][+b.dataset.k] + +b.dataset.d));
    [0, 1].forEach(k => $("eq" + k).addEventListener("input", e => { const v = parseInt(e.target.value, 10); if (!isNaN(v)) this.change(k, v, true); }));
    $("eqGo").onclick = () => this.solve(padVal === "" ? null : +padVal);
    this.flipBtn.hidden = true;
  },
  change(k, v, typing) {
    const [lo, hi0] = this.limits[this.op][k];
    const hi = this.op === "−" && k === 1 ? Math.min(hi0, this.a) : hi0;
    v = Math.max(lo, Math.min(hi, v));
    const vals = this.vals[this.op];
    vals[k] = v;
    if (this.op === "−" && vals[1] > vals[0]) vals[1] = vals[0];
    [0, 1].forEach(i => { const el = $("eq" + i); if (!(typing && i === k && document.activeElement === el)) el.value = vals[i]; });
    if (this.solved) {   // changing the numbers starts a fresh problem
      clearBoard();
      this.solved = false; this.flipped = false; this.reviewed = false; this.guess = null; this.ghosts = [];
      this.A = []; this.B = [];
      this.renderEq();
      this.listen();
    }
    this.sync(true);
  },
  // Make sure we have the right number of items, then lay them out.
  sync(anim) {
    const grow = (arr, n) => {
      const gone = arr.splice(n);
      if (gone.length) removeSprites(gone);
      const add = n - arr.length, st = Math.min(50, 500 / Math.max(1, add));
      for (let k = 0; k < add; k++) { const sp = sprite(0, 0, { delay: k * st }); sp.isNew = true; arr.push(sp); }
    };
    const { a, b } = this;
    if (this.op === "+") { grow(this.A, a); grow(this.B, b); }
    else if (this.op === "×") grow(this.A, a * b);
    else { grow(this.A, a); this.B = []; }
    this.layoutPre(anim);
  },
  put(sp, p, anim) {
    if (sp.isNew || !anim) { moveTo(sp, p.x, p.y, 0, 0); sp.isNew = false; } else moveTo(sp, p.x, p.y);
  },
  layoutPre(anim) {
    const r = board(), LB = this.LB, { a, b } = this;
    E.frames = []; E.labels = [];
    const body = shrink(r, { bottom: LB });
    const textY = r.y + r.h - LB / 2;
    if (this.op === "+") {
      // Side by side on wide screens, one above the other on tall narrow ones.
      const stack = this.stacked(), mid = stack ? 44 : 56;
      let L, R;
      if (stack) {
        const half = (body.h - mid) / 2;
        L = { x: r.x, y: r.y, w: r.w, h: half }; R = { x: r.x, y: r.y + half + mid, w: r.w, h: half };
      } else {
        const half = (r.w - mid) / 2;
        L = { x: r.x, y: r.y, w: half, h: body.h }; R = { x: r.x + half + mid, y: r.y, w: half, h: body.h };
      }
      if (this.level === "medium") {
        const s = Math.min(fitScatter(L, a), fitScatter(R, b));
        E.S = s;
        const PL = scatterKeep(this.A, L, s), PR = scatterKeep(this.B, R, s);
        this.A.forEach((sp, i) => { sp.tint = TINT_A; this.put(sp, PL[i], anim); });
        this.B.forEach((sp, i) => { sp.tint = TINT_B; this.put(sp, PR[i], anim); });
      } else {
        const s = Math.min(fitGroups(L, a, 10), fitGroups(R, b, 10));
        E.S = s;
        const GL = groupLayout(L, a, 10, s), GR = groupLayout(R, b, 10, s);
        if (a) GL.boxes.forEach(f => frame(f));
        if (b) GR.boxes.forEach(f => frame(f));
        this.A.forEach((sp, i) => { sp.tint = TINT_A; this.put(sp, GL.spot(i), anim); });
        this.B.forEach((sp, i) => { sp.tint = TINT_B; this.put(sp, GR.spot(i), anim); });
      }
      if (stack) {
        label({ x: r.x + r.w / 2, y: L.y + L.h + mid / 2, text: "+", size: 36 });
        label({ x: r.x + r.w / 2, y: textY, text: `${a} and ${b}`, size: 26 });
      } else {
        label({ x: L.x + L.w / 2, y: textY, text: String(a), size: 32, color: TINT_A });
        label({ x: R.x + R.w / 2, y: textY, text: String(b), size: 32, color: TINT_B });
        label({ x: r.x + r.w / 2, y: body.y + body.h / 2, text: "+", size: 44 });
      }
    } else if (this.op === "−") {
      let spot;
      if (this.level === "medium") {
        const s = fitScatter(body, a); E.S = s;
        const P = scatterKeep(this.A, body, s); spot = i => P[i];
      } else {
        const s = fitGroups(body, a, 10); E.S = s;
        const G = groupLayout(body, a, 10, s); spot = G.spot;
        if (a) G.boxes.forEach(f => frame(f));
      }
      this.A.forEach((sp, i) => { sp.tint = i < a - b ? TINT_A : TINT_OFF; this.put(sp, spot(i), anim); });
      label({ x: r.x + r.w / 2, y: textY, text: `${a} take away ${b}`, size: 26 });
    } else if (this.op === "×") {
      let spot;
      if (this.level === "medium") {
        const s = fitScatter(body, a * b); E.S = s;
        const P = scatterKeep(this.A, body, s); spot = i => P[i];
      } else {
        const s = fitGroups(body, a * b, b, MAXS(), { nf: a }); E.S = s;
        const G = groupLayout(body, a * b, b, s, { nf: a }); spot = G.spot;
        G.boxes.forEach(f => frame(f));
      }
      this.A.forEach((sp, i) => {
        sp.g = Math.floor(i / b); sp.j = i % b;
        sp.tint = PALETTE[sp.g % PALETTE.length]; sp.ci = sp.g;
        this.put(sp, spot(i), anim);
      });
      label({ x: r.x + r.w / 2, y: textY, text: `${a} group${a === 1 ? "" : "s"} of ${b}`, size: 26 });
    } else {
      const { top, s, GT, GB } = this.divLayout();
      E.S = s;
      let spot = GT.spot;
      if (this.level === "medium") { const P = scatterKeep(this.A, top, s); spot = i => P[i]; }
      else if (a) GT.boxes.forEach(f => frame({ ...f, dashed: true, fill: null }));
      GB.boxes.forEach(f => frame(f));
      this.A.forEach((sp, i) => { sp.tint = TINT_A; this.put(sp, spot(i), anim); });
      label({ x: r.x + r.w / 2, y: textY, text: `Share ${a} into ${b} group${b === 1 ? "" : "s"}`, size: 26 });
    }
    // Hard: keep the items hidden until the answer is checked; just the equation shows.
    const hard = this.level === "hard";
    this.A.concat(this.B).forEach(sp => { sp.hidden = hard; });
    if (hard) {
      E.frames = []; E.labels = [];
      const cy = r.y + r.h * 0.42;
      label({ x: r.x + r.w / 2, y: cy, text: "🧠", size: Math.min(110, r.w * .25) });
      label({ x: r.x + r.w / 2, y: cy + Math.min(90, r.w * .2), text: "Solve it in your head!", size: r.w < 400 ? 20 : 30, color: css("--purple") });
    }
  },
  divLayout() {
    const r = board(), { a, b } = this;
    const body = shrink(r, { bottom: this.LB });
    const q = Math.floor(a / b), cap = Math.max(1, q);
    const top = { x: body.x, y: body.y, w: body.w, h: body.h * 0.42 };
    const bot = { x: body.x, y: body.y + top.h + 12, w: body.w, h: body.h - top.h - 12 };
    const below = 26;
    const topFit = this.level === "medium" ? fitScatter(top, a) : fitGroups(top, a, 10);
    const s = Math.min(topFit, fitGroups(bot, b * cap, cap, MAXS(), { nf: b, below }));
    const GT = groupLayout(top, a, 10, s);
    const GB = groupLayout(bot, b * cap, cap, s, { nf: b, below });
    return { top, bot, s, GT, GB, q, cap, rem: a % b };
  },
  stacked() { const r = board(); return r.w < r.h * 0.9; },
  tap(x, y) {
    if (this.solved) return;
    if (this.op === "+") {
      const first = this.stacked() ? y < E.H / 2 : x < E.W / 2;
      this.change(first ? 0 : 1, (first ? this.a : this.b) + 1);
    }
    else this.change(0, this.a + 1);
  },
  // The correct answer (for ÷, how many in each group).
  answer() {
    const { a, b } = this;
    return this.op === "+" ? a + b : this.op === "−" ? a - b : this.op === "×" ? a * b : Math.floor(a / b);
  },
  eqText() {
    const { a, b } = this, n = this.answer(), rem = this.op === "÷" ? a % b : 0;
    return `${a} ${this.op} ${b} = ${n}${rem ? `, ${rem} left over` : ""}`;
  },
  spoken() {
    const { a, b } = this, n = this.answer(), rem = this.op === "÷" ? a % b : 0;
    const word = { "+": "plus", "−": "take away", "×": "times", "÷": "shared into" }[this.op];
    return `${a} ${word} ${b}${this.op === "÷" ? " groups" : ""} is ${n}${this.op === "÷" ? " each" : ""}${rem ? `, with ${rem} left over` : ""}`;
  },
  // Press = : check her answer, play a sound, then show it happening on the board.
  solve(g) {
    if (this.solved) return;
    if (g === null || g === undefined || isNaN(g)) {
      banner("Type your answer first, then press =", "soft");
      say("Type your answer first, then press equals.");
      return;
    }
    this.solved = true;
    this.guess = g;
    this.right = g === this.answer();
    padOff();
    const res = $("eqR");
    res.textContent = g;
    res.classList.add(this.right ? "right" : "wrong");
    if (this.right) {
      celebrate(pick(["Yes! You got it! 🎉", "Amazing! 🌟", "You're a math star! ⭐", "Hooray! That's right! 🎉"]), `Yes! ${this.spoken()}!`);
    } else {
      sound("bad");
      banner("Not quite. Let's see why! 👀", "soft");
      say("Not quite. Let's see why.");
    }
    const hidden = this.A.concat(this.B).filter(sp => sp.hidden);
    if (!hidden.length) return this.layoutSolved(true, true);
    // Hard level: now the items pop in, then act it out.
    E.labels = [];
    this.layoutHardReveal();
    const t = now(), st = Math.min(40, 600 / hidden.length);
    hidden.forEach((sp, i) => { sp.hidden = false; sp.born = t + i * st; });
    bump(t + hidden.length * st + POP_MS);
    later(() => this.layoutSolved(true, true), hidden.length * st + 700);
  },
  // Show the items in their Easy-level spots, ready to act out the answer.
  layoutHardReveal() {
    const keep = this.level;
    this.level = "easy";
    this.layoutPre(false);
    this.level = keep;
  },
  flip() {
    if (!this.solved || this.op !== "×") return;
    const v = this.vals["×"];
    this.vals["×"] = [v[1], v[0]];
    this.flipped = !this.flipped;
    $("eq0").value = this.a; $("eq1").value = this.b;
    removeSprites(this.ghosts); this.ghosts = [];
    this.A.forEach(sp => { sp.hi = false; });
    this.reviewed = false;
    E.timers.forEach(clearTimeout); E.timers = [];
    this.layoutSolved(true, false);
  },
  // Lay out the answer. With anim, act it out and count; with review, explain at the end.
  layoutSolved(anim, review) {
    const r = board(), LB = this.LB, { a, b } = this, n = this.answer(), g = this.guess;
    const body = shrink(r, { bottom: LB });
    const textY = r.y + r.h - LB / 2;
    const wrong = !this.right && !this.flipped;
    this.ghostSpots = []; this.missed = [];
    let counter = null;
    if (anim) { counter = { x: r.x + r.w / 2, y: textY, text: "", size: 30, born: 0 }; }
    const tick = k => { counter.text = String(k); kick(); };
    const finish = () => {
      E.labels = E.labels.filter(l => l !== counter);
      label({ x: r.x + r.w / 2, y: textY, text: this.eqText(), size: 30, delay: anim ? 0 : undefined });
      // Put the dotted "extra" boxes back in place after a resize.
      this.ghosts.forEach((sp, k) => { const p = this.ghostSpots[k]; if (p) moveTo(sp, p.x, p.y, 0, 0); });
      if (anim && review) this.review();
    };
    const extraFor = cap => (wrong && g > n ? Math.min(g - n, cap) : 0);

    if (this.op === "+") {
      const all = this.A.concat(this.B), extra = extraFor(40), slots = n + extra;
      const s = fitGroups(body, slots, 10);
      E.S = s; E.frames = []; E.labels = [];
      const G = groupLayout(body, slots, 10, s);
      G.boxes.forEach(f => frame(anim ? { ...f, delay: 200 } : f));
      all.forEach((sp, i) => { const p = G.spot(i); moveTo(sp, p.x, p.y, anim ? i * 20 : 0, anim ? MOVE_MS : 0); });
      this.ghostSpots = Array.from({ length: extra }, (_, k) => G.spot(n + k));
      if (wrong && g < n) this.missed = all.slice(Math.max(0, g));
      if (!anim) return finish();
      E.labels.push(counter);
      countUp(all, { delay: MOVE_MS + all.length * 20 + 100, onTick: tick, done: finish });
    }

    else if (this.op === "−") {
      const keep = this.A.slice(0, a - b), go = this.A.slice(a - b);
      const extra = extraFor(40), total = Math.max(a, n + extra);
      const s = fitGroups(body, total, 10);
      E.S = s; E.frames = []; E.labels = [];
      const G = groupLayout(body, total, 10, s);
      G.boxes.forEach(f => frame(f));
      keep.forEach((sp, i) => { const p = G.spot(i); moveTo(sp, p.x, p.y, 0, anim ? 400 : 0); });
      this.ghostSpots = Array.from({ length: extra }, (_, k) => G.spot(n + k));
      if (wrong && g < n) this.missed = keep.slice(Math.max(0, g));
      this.A = keep;
      if (!anim) { removeSprites(go); return finish(); }
      go.slice().reverse().forEach((sp, i) => { const p = posAt(sp, now()); leave(sp, E.W + E.S * 2, p.y, 400 + i * 160, 1000); });
      E.labels.push(counter);
      const t = 400 + go.length * 160 + 1100;
      if (!keep.length) later(() => tick(0), t);
      countUp(keep, { delay: t, onTick: tick, done: finish });
    }

    else if (this.op === "×") {
      const LW = 64, extra = extraFor(2 * b), rows = a + Math.ceil(extra / b);
      const area = shrink(body, { right: LW });
      const s = fitGrid(area, rows, b);
      E.S = s; E.frames = []; E.labels = [];
      const spot = gridSpots(area, rows, b, s);
      const rowOf = sp => (this.flipped ? sp.j : sp.g), colOf = sp => (this.flipped ? sp.g : sp.j);
      this.A.forEach((sp, i) => { const p = spot(rowOf(sp), colOf(sp)); moveTo(sp, p.x, p.y, anim ? i * 10 : 0, anim ? MOVE_MS : 0); });
      this.ghostSpots = Array.from({ length: extra }, (_, k) => spot(a + Math.floor(k / b), k % b));
      if (wrong && g < n) {
        const order = this.A.slice().sort((p, q) => rowOf(p) - rowOf(q) || colOf(p) - colOf(q));
        this.missed = order.slice(Math.max(0, g));
      }
      const rowLabel = (row, delay) => {
        const p = spot(row, b - 1);
        label({ x: p.x + s + 30, y: p.y + s / 2, text: String((row + 1) * b), size: Math.max(14, Math.min(26, s * .7)), color: css("--accent"), delay });
      };
      if (!anim) { for (let row = 0; row < a; row++) rowLabel(row); this.flipBtn.hidden = false; return finish(); }
      E.labels.push(counter);
      const start = MOVE_MS + a * b * 10 + 150, st = Math.min(800, 3200 / a);
      for (let row = 0; row < a; row++) {
        later(() => {
          this.A.filter(sp => rowOf(sp) === row).forEach((sp, i) => pulse(sp, i * 25));
          rowLabel(row, 0);
          tick((row + 1) * b);
          say(String((row + 1) * b), true);
        }, start + row * st);
      }
      later(() => { finish(); this.flipBtn.hidden = false; }, start + a * st + 300);
    }

    else {
      const { GT, GB, s, q, cap, rem } = this.divLayout();
      E.S = s; E.frames = []; E.labels = [];
      GB.boxes.forEach(f => frame({ ...f, hi: this.reviewed && wrong }));
      const dealt = this.A.slice(0, b * q), left = this.A.slice(b * q);
      const st = Math.min(350, 3500 / Math.max(1, dealt.length));
      dealt.forEach((sp, k) => {
        const p = GB.spot((k % b) * cap + Math.floor(k / b));
        moveTo(sp, p.x, p.y, anim ? k * st : 0, anim ? 450 : 0);
      });
      const GL = groupLayout({ x: r.x, w: r.w, y: GT.top, h: Math.max(20, GB.top - GT.top - 12) }, rem, 10, s);
      const wrapUp = () => {
        GB.boxes.forEach(f => label({ x: f.x + f.w / 2, y: f.y + f.h + 14, text: String(q), size: Math.max(14, Math.min(24, s * .6)), color: css("--accent"), delay: anim ? 0 : undefined }));
        left.forEach((sp, i) => { const p = GL.spot(i); sp.hi = true; moveTo(sp, p.x, p.y, 0, anim ? 400 : 0); if (anim) pulse(sp, 450); });
        if (rem) label({ x: r.x + r.w / 2, y: GL.bottom + 16, text: `${rem} left over`, size: 20, color: css("--muted"), delay: anim ? 0 : undefined });
        if (anim) tick(q);
        finish();
      };
      if (anim) { E.labels.push(counter); later(wrapUp, dealt.length * st + 500); } else wrapUp();
    }
  },
  // After the animation: celebrate, or show and explain what went wrong.
  review() {
    this.reviewed = true;
    const { a, b } = this, n = this.answer(), g = this.guess, op = this.op;
    const out = $("prompt");
    if (this.right) {
      out.insertAdjacentHTML("beforeend", `<div class="row"><span class="seq">✅ ${this.eqText()}</span></div>`);
      promptButtons([["New problem ▶", () => this.random(), "go"]]);
      return;
    }
    // Show it: dotted boxes for extra ones she counted, yellow rings on the ones she missed.
    this.ghosts = this.ghostSpots.map((p, k) => sprite(p.x, p.y, { delay: k * 70, ghost: true, ghostHi: true }));
    this.missed.forEach((sp, i) => { sp.hi = true; pulse(sp, i * 90); });
    if (op === "÷") {
      E.frames.forEach(f => { f.hi = true; });
      // bounce the items in the first group, one by one, to count them
      this.A.filter((sp, k) => k < b * n && k % b === 0).forEach((sp, i) => pulse(sp, i * 250));
      kick();
    }
    const diff = g - n, rem = a % b;
    const off = diff > 0 ? `${g} is ${diff} too many.` : `${g} is ${-diff} too few.`;
    const why = {
      "+": `When we put ${a} and ${b} together and count them all, we get ${n}.`,
      "−": `We started with ${a}. ${b} went away, so ${n} ${n === 1 ? "is" : "are"} left.`,
      "×": `${a} group${a === 1 ? "" : "s"} of ${b} make${a === 1 ? "s" : ""} ${n}${a > 1 && a <= 10 ? `: ${Array.from({ length: a }, (_, i) => (i + 1) * b).join(", ")}` : ""}.`,
      "÷": `Sharing ${a} into ${b} groups puts ${n} in each group${rem ? `, with ${rem} left over` : ""}.`,
    }[op];
    const look = this.ghosts.length ? " The dotted boxes show the extra ones."
      : this.missed.length ? " The ones with yellow rings are the ones you missed." : "";
    const cheer = pick(["Good try! Mistakes help your brain grow 🌱", "You're getting closer! Keep going 💪", "Nice thinking! Have another go ⭐", "Great effort! You can do it 🌈"]);
    out.insertAdjacentHTML("beforeend",
      `<div class="row explain">You said <b>${g}</b>, but ${this.eqText()}. ${why} ${off}${look}</div>
       <div class="row cheer">${cheer}</div>`);
    promptButtons([["↺ Try again", () => this.reset()], ["New problem ▶", () => this.random(), "go"]]);
    say(`You said ${g}. ${why} ${off} ${plainText(cheer)}`);
  },
  layout() { if (this.solved) this.layoutSolved(false, false); else this.layoutPre(false); },
};

/* ---------------- 3. Guess how many ---------------- */
ACTS.guess = {
  icon: "🤔", title: "Guess how many", desc: "Take a quick look, make a guess, then count to check.",
  up: 20, hide: 5, move: true, usesPad: true,
  start() {
    choice("Up to", [[10, "10"], [20, "20"], [50, "50"], [100, "100"]], this.up, v => { this.up = v; this.round(); });
    choice("Hide after", [[3, "3 s"], [5, "5 s"], [10, "10 s"], [0, "Never"]], this.hide, v => { this.hide = v; }, 2);
    choice("They…", [[true, "Move"], [false, "Stay still"]], this.move, v => {
      this.move = v;
      if (this.answered) return;
      if (v) startMoving(); else stopMoving();
    }, 2);
    sideButton(side(""), "▶ New round", () => this.round(), "go");
    this.round();
  },
  stop() { stopMoving(); },
  round() {
    clearBoard();
    this.answered = false;
    let n;
    do n = rand(Math.max(3, Math.ceil(this.up * .3)), this.up); while (n === this.n);
    this.n = n;
    this.list = [];
    for (let i = 0; i < n; i++) this.list.push(sprite(0, 0, { delay: i * Math.min(40, 600 / n), ci: i }));
    scatterList(this.list);
    setPrompt(`How many ${P()} are there? <b>Make a guess!</b>`);
    padOn(g => this.check(g));
    if (this.move) later(() => { if (!this.answered) startMoving(); }, 900);
    if (this.hide) later(() => {
      if (this.answered) return;
      veil(true);
      setPrompt(`They're hiding! How many ${P()} did you see?`);
    }, 900 + this.hide * 1000);
  },
  check(g) {
    if (this.answered) return;
    this.answered = true;
    padOff();
    stopMoving();
    if (E.veil && E.veil.hide) veil(false);
    const n = this.n;
    const t = arrangeTens(this.list, true);
    setPrompt(`You guessed <b>${g}</b>. Let's count… <b id="cnt"></b>`);
    countUp(this.list, {
      delay: t + 100,
      onTick: k => { const c = $("cnt"); if (c) c.textContent = k; },
      done: () => {
        const d = Math.abs(g - n);
        setPrompt(`You guessed <b>${g}</b>. There are <b>${n}</b> ${P()}.`);
        nextButton(() => this.round());
        if (d === 0) celebrate("Exactly right! 🎯");
        else if (d <= Math.max(1, Math.round(n * .1))) celebrate("Super close! 🌟");
        else if (d <= Math.round(n * .25)) { banner("Good guess! 👍"); say(`Good guess! There are ${n}.`); }
        else encourage("Nice try! 💪", `Nice try! There are ${n}.`);
      },
    });
  },
  layout() {
    if (this.answered) arrangeTens(this.list, false);
    else if (!E.moving) scatterList(this.list);
  },
};

/* ---------------- 5 & 6. Missing number / Make 10 ---------------- */
function missingAct(make) {
  return {
    icon: make ? "🔟" : "❓",
    title: make ? "Make 10" : "Missing number",
    desc: make ? "How many more to fill the box?" : "Find the number that's hiding.",
    up: 10, usesPad: true,
    start() {
      choice(make ? "Make" : "Up to", [[10, "10"], [20, "20"]], this.up, v => { this.up = v; this.round(); }, 2);
      const s = side("");
      sideButton(s, "▶ Next", () => this.round(), "go");
      s.insertAdjacentHTML("beforeend", '<p class="hint">Tap the empty spots to fill them in, then type the answer.</p>');
      this.round();
    },
    round() {
      clearBoard();
      this.done = false; this.tries = 0;
      let T, k;
      do {
        T = make ? this.up : rand(3, this.up);
        k = rand(this.up === 20 && make ? 3 : 1, T - 1);
      } while (this.last === `${T},${k}`);
      this.last = `${T},${k}`;
      this.T = T; this.k = k; this.m = T - k;
      this.first = make ? true : Math.random() < .5;   // "k + ?" or "? + k"
      this.order = []; this.slots = [];
      for (let i = 0; i < T; i++) {
        const known = this.first ? i < k : i >= this.m;
        const sp = sprite(0, 0, { delay: i * 25 });
        if (known) sp.tint = TINT_A; else { sp.ghost = true; sp.slot = true; this.slots.push(sp); }
        this.order.push(sp);
      }
      this.layout();
      this.renderEq();
      padOn(g => this.check(g));
      say(make ? `How many more to make ${T}?` : this.first ? `${k} plus what makes ${T}?` : `What plus ${k} makes ${T}?`);
    },
    layout() {
      const r = board();
      const s = fitGroups(r, this.T, 10);
      E.S = s; E.frames = [];
      const G = groupLayout(r, this.T, 10, s);
      G.boxes.forEach(b => frame(b));
      this.order.forEach((sp, i) => { const p = G.spot(i); moveTo(sp, p.x, p.y, 0, 0); });
    },
    renderEq() {
      const filled = this.slots.filter(s => !s.ghost).length;
      const q = `<span class="tile b">${this.done ? this.m : (filled || "?")}</span>`;
      const kk = `<span class="tile a">${this.k}</span>`;
      const eq = `<div class="eq">${this.first ? kk : q}<span class="opsign">+</span>${this.first ? q : kk}<span class="opsign">=</span><span class="tile">${this.T}</span></div>`;
      setPrompt((make ? `<div class="row">How many more to make <b>${this.T}</b>?</div>` : "") + eq);
      if (this.done) nextButton(() => this.round());
    },
    tap(x, y) {
      if (this.done) return;
      const sp = hitSprite(x, y, s => s.slot);
      if (!sp) return;
      sp.ghost = !sp.ghost;
      if (!sp.ghost) { sp.tint = TINT_B; sp.born = now(); bump(now() + POP_MS); }
      kick();
      this.renderEq();
    },
    check(g) {
      if (this.done) return;
      if (g === this.m) {
        this.done = true;
        padOff();
        const rest = this.slots.filter(s => s.ghost);
        rest.forEach((sp, i) => { sp.ghost = false; sp.tint = TINT_B; sp.born = now() + i * 120; bump(sp.born + POP_MS); });
        this.renderEq();
        const eq = this.first ? `${this.k} + ${this.m} = ${this.T}` : `${this.m} + ${this.k} = ${this.T}`;
        celebrate(`${eq} 🎉`, this.first ? `Yes! ${this.k} plus ${this.m} makes ${this.T}!` : `Yes! ${this.m} plus ${this.k} makes ${this.T}!`);
        countUp(this.order, { delay: rest.length * 120 + 300 });
      } else {
        this.tries++;
        padClear();
        encourage(this.tries >= 2 ? "Tap the empty spots and count them!" : "Not quite. Try again!");
      }
    },
  };
}
ACTS.missing = missingAct(false);
ACTS.make10 = missingAct(true);

ACTS.skip = {
  icon: "🦘", title: "Skip counting", desc: "Count by 2s, 5s and 10s, one group at a time.",
  step: 5, groups: 10,
  start() {
    choice("Count by", [[2, "2s"], [3, "3s"], [4, "4s"], [5, "5s"], [10, "10s"]], this.step, v => { this.step = v; this.setup(); });
    choice("Groups", [[5, "5"], [10, "10"]], this.groups, v => { this.groups = v; this.setup(); }, 2);
    const s = side("");
    sideButton(s, "▶ Count for me", () => this.auto(), "go");
    sideButton(s, "↺ Start over", () => this.setup());
    this.setup();
  },
  setup() {
    clearBoard();
    this.counted = 0; this.seq = [];
    this.list = [];
    const n = this.step * this.groups;
    for (let i = 0; i < n; i++) {
      const sp = sprite(0, 0, { delay: i * Math.min(15, 600 / n) });
      sp.g = Math.floor(i / this.step);
      sp.tint = sp.g % 2 ? TINT_B : TINT_A;
      sp.ci = sp.g;
      this.list.push(sp);
    }
    this.layout();
    this.prompt();
  },
  layout() {
    const r = board(), n = this.list.length, below = 30;
    const s = fitGroups(r, n, this.step, MAXS(), { below });
    E.S = s; E.frames = []; E.labels = [];
    this.G = groupLayout(r, n, this.step, s, { below });
    this.G.boxes.forEach((b, k) => { const f = frame(b); f.hi = k < this.counted; });
    for (let k = 0; k < this.counted; k++) this.addLabel(k, false);
    this.list.forEach((sp, i) => { const p = this.G.spot(i); moveTo(sp, p.x, p.y, 0, 0); });
  },
  addLabel(k, fade) {
    const b = this.G.boxes[k];
    label({ x: b.x + b.w / 2, y: b.y + b.h + 15, text: String((k + 1) * this.step), size: Math.max(14, Math.min(24, b.w / 3)), color: css("--accent"), delay: fade ? 0 : undefined });
  },
  prompt() {
    if (!this.counted) setPrompt(`Tap the groups to count by <b>${this.step}s</b>!`);
    else setPrompt(`<span class="seq">${this.seq.join(", ")}</span>`);
  },
  tap() { this.next(); },
  next() {
    if (this.counted >= this.groups) return;
    const k = this.counted++;
    E.frames[k].hi = true;
    this.list.filter(s => s.g === k).forEach((s, i) => pulse(s, i * 30));
    this.addLabel(k, true);
    const v = (k + 1) * this.step;
    this.seq.push(v);
    this.prompt();
    say(String(v));
    kick();
    if (this.counted === this.groups) later(() => celebrate(`You counted by ${this.step}s to ${v}! 🦘`), 500);
  },
  auto() {
    if (this.counted >= this.groups) this.setup();
    const go = () => { if (this.counted < this.groups) { this.next(); later(go, 900); } };
    go();
  },
};

ACTS.more = {
  icon: "⚖️", title: "Which is more?", desc: "Two piles. Which side has more?",
  up: 10,
  start() {
    choice("Up to", [[5, "5"], [10, "10"], [20, "20"], [50, "50"]], this.up, v => { this.up = v; this.round(); });
    sideButton(side(""), "▶ Next", () => this.round(), "go");
    this.round();
  },
  round() {
    clearBoard();
    this.done = false;
    const up = this.up, a = rand(1, up);
    let b;
    if (Math.random() < .15) b = a; else do b = rand(1, up); while (b === a);
    this.a = a; this.b = b;
    this.L = []; this.R = [];
    for (let i = 0; i < a; i++) this.L.push(sprite(0, 0, { delay: i * 30, tint: TINT_A }));
    for (let i = 0; i < b; i++) this.R.push(sprite(0, 0, { delay: i * 30, tint: TINT_B }));
    this.layout();
    setPrompt("Which side has <b>more</b>?");
    promptButtons([["◀ This side", () => this.answer("left")], ["Same", () => this.answer("same")], ["This side ▶", () => this.answer("right")]]);
    say("Which side has more?");
  },
  scatter() {
    const r = board(), mid = 24, half = (r.w - mid) / 2;
    const L = { x: r.x, y: r.y, w: half, h: r.h }, R = { x: r.x + half + mid, y: r.y, w: half, h: r.h };
    const s = Math.min(fitScatter(L, this.a), fitScatter(R, this.b));
    E.S = s;
    E.frames = [{ x: r.x + r.w / 2 - 1, y: r.y, w: 2, h: r.h, bw: 2, fill: null, dashed: true, radius: 0, born: 0 }];
    scatterSpots(L, this.a, s).forEach((p, i) => moveTo(this.L[i], p.x, p.y, 0, 0));
    scatterSpots(R, this.b, s).forEach((p, i) => moveTo(this.R[i], p.x, p.y, 0, 0));
  },
  // Line both piles up in matching rows so you can see which has extra.
  lineUp(anim) {
    const r = board(), { a, b } = this, m = Math.max(a, b);
    let s = MAXS(), cols, bands;
    for (; s > 3; s -= .5) {
      const c = s * 1.15;
      cols = Math.max(1, Math.floor(r.w / c));
      bands = Math.ceil(m / cols);
      if (bands * c * 2.6 <= r.h) break;
    }
    E.S = s; E.frames = [];
    const c = s * 1.15, used = Math.min(cols, m);
    const ox = r.x + (r.w - used * c) / 2, oy = r.y + (r.h - bands * c * 2.6 + c * .6) / 2;
    const put = (sp, i, row, k) => {
      const x = ox + (i % cols) * c, y = oy + Math.floor(i / cols) * c * 2.6 + row * c;
      moveTo(sp, x, y, anim ? k * 12 : 0, anim ? MOVE_MS : 0);
      if (i >= Math.min(a, b)) sp.hi = true;
    };
    this.L.forEach((sp, i) => put(sp, i, 0, i));
    this.R.forEach((sp, i) => put(sp, i, 1, i));
  },
  answer(side) {
    if (this.done) return;
    this.done = true;
    const { a, b } = this;
    const right = a > b ? "left" : a < b ? "right" : "same";
    this.lineUp(true);
    later(() => {
      const msg = a === b ? `They're the same! ${a} and ${b}.` : `${a > b ? "Left" : "Right"} has ${Math.abs(a - b)} more!`;
      setPrompt(`Left: <b>${a}</b> · Right: <b>${b}</b>. ${msg}`);
      nextButton(() => this.round());
      if (side === right) celebrate(msg + " ⚖️", msg);
      else encourage(msg);
    }, MOVE_MS + Math.max(a, b) * 12 + 200);
  },
  tap(x) { if (!this.done) this.answer(x < E.W / 2 ? "left" : "right"); },
  layout() { if (this.done) this.lineUp(false); else this.scatter(); },
};

ACTS.story = {

    const up = this.up;
    if (kind === "add") { this.a = rand(2, up - 2); this.b = rand(1, Math.min(up - this.a, up === 10 ? 5 : 9)); this.ans = this.a + this.b; }
    if (kind === "sub") { this.a = rand(3, up); this.b = rand(1, this.a - 1); this.ans = this.a - this.b; }
    if (kind === "mul") { this.a = rand(2, up === 10 ? 4 : 5); this.b = rand(2, up === 10 ? 3 : 5); this.ans = this.a * this.b; }
    this.tpl = pick(STORIES[kind]);
    this.render();

  },
  render(extra = "") {

  },
  // Act the story out on the board.
  act() {
    const r = board(), { a, b, kind } = this;
    this.list = [];
    let ready;
    if (kind === "add") {
      const s = fitScatter(r, a + b); E.S = s;
      const spots = scatterSpots(r, a + b, s);
      for (let i = 0; i < a; i++) this.list.push(sprite(spots[i].x, spots[i].y, { delay: i * 60, tint: TINT_A }));
      later(() => {
        for (let j = 0; j < b; j++) {
          const p = spots[a + j], sp = sprite(E.W + 10, p.y, { tint: TINT_B });
          moveTo(sp, p.x, p.y, j * 250, 900);
          this.list.push(sp);
        }
      }, 2200);

      const spots = scatterSpots(r, a, s);
      for (let i = 0; i < a; i++) this.list.push(sprite(spots[i].x, spots[i].y, { delay: i * 60, tint: i < a - b ? TINT_A : TINT_OFF }));
      later(() => {
        const go = this.list.splice(a - b);
        go.forEach((sp, j) => leave(sp, E.W + E.S * 2, sp.ty, j * 250, 1000));
      }, 2200);
      ready = 2200 + b * 250 + 1000;
    } else {
      const s = fitGroups(r, a * b, b, MAXS(), { nf: a }); E.S = s;
      const G = groupLayout(r, a * b, b, s, { nf: a });
      G.boxes.forEach((f, g) => frame({ ...f, delay: g * 700 }));
      for (let i = 0; i < a * b; i++) {
        const g = Math.floor(i / b), p = G.spot(i);
        this.list.push(sprite(p.x, p.y, { delay: g * 700 + (i % b) * 80 + 200, tint: PALETTE[g % PALETTE.length], ci: g }));
      }
      ready = a * 700 + b * 80 + 300;
    }
    later(() => { if (!this.done) padOn(g => this.check(g)); }, reduceMotion ? 0 : ready);
  },
  check(g) {
    if (this.done) return;
    const sign = { add: "+", sub: "−", mul: "×" }[this.kind];
    const eq = `${this.a} ${sign} ${this.b} = ${this.ans}`;
    if (g === this.ans) {
      this.done = true;
      padOff();
      this.render(`<div class="row"><span class="seq">${eq}</span></div>`);
      this.finish(() => celebrate(`${this.ans}! That's right! 🎉`, `${this.ans}! That's right!`));
    } else if (++this.tries >= 2) {
      this.done = true;
      padOff();
      this.render(`<div class="row">The answer is <span class="seq">${eq}</span></div>`);
      this.finish(() => encourage(`The answer is ${this.ans}.`));
    } else {
      padClear();
      encourage(`Not quite! Count the ${P()} and try again.`);
    }
  },
  finish(then) {
    const live = this.list.filter(s => !s.die);
    const t = this.kind === "mul" ? 0 : arrangeTens(live, true);
    countUp(live, { delay: t + 150, done: then });
  },
  layout() {
    if (this.done) { if (this.kind !== "mul") arrangeTens(this.list.filter(s => !s.die), false); return; }
    clearBoard();   // replay the story to fit the new size
    this.act();
  },
};

/* =====================================================================
   Wiring it together
   ===================================================================== */
let act = null;
function openActivity(id) {
  if (act && act.stop) act.stop();
  clearBoard();
  stopSpeaking();
  $("banner").className = "banner";
  act = ACTS[id];
  bigItems = id !== "count";
  imgCache.clear();
  $("actTitle").textContent = act.icon + " " + act.title;
  $("mTitle").textContent = act.icon + " " + act.title;
  $("mpin").innerHTML = "";
  closeDrawer();
  $("actControls").innerHTML = "";
  setPrompt("");
  padOff();
  padShow(!!act.usesPad);
  padEl.classList.toggle("bare", id === "eq");   // equations show the answer in the = box instead
  $("home").hidden = true;
  placePins();
  resizeCanvas();
  act.start();
  placePins();   // move this activity's pinned controls (Count's number box) above the board on phones
  if (resizeCanvas() && act.layout) act.layout(false);
}

// Phones: the settings panel slides in from the side; pinned controls move above the board.
const phoneMQ = matchMedia("(max-width: 700px)");
function openDrawer() { document.body.classList.add("drawer-open"); }
function closeDrawer() { document.body.classList.remove("drawer-open"); }
function placePins() {
  const pins = [...document.querySelectorAll("section.pin")];
  if (phoneMQ.matches) pins.forEach(p => $("mpin").appendChild(p));
  else pins.reverse().forEach(p => $("actControls").prepend(p));
}
phoneMQ.addEventListener("change", placePins);
$("mOpts").onclick = openDrawer;
$("drawerClose").onclick = closeDrawer;
$("scrim").onclick = closeDrawer;
$("mHome").onclick = () => { closeDrawer(); $("home").hidden = false; stopSpeaking(); };

// Home screen
for (const [id, a] of Object.entries(ACTS)) {
  const c = document.createElement("button");
  c.className = "card";
  c.innerHTML = `<div class="ic">${a.icon}</div><div class="t">${a.title}</div><div class="d">${a.desc}</div>`;
  c.onclick = () => openActivity(id);
  $("cards").appendChild(c);
}
$("homeBtn").onclick = () => { $("home").hidden = false; stopSpeaking(); };

// Item picker
for (const it of ITEMS) {
  const b = document.createElement("button");
  b.className = "chip";
  b.title = it.label;
  b.setAttribute("aria-label", it.label);
  b.setAttribute("aria-pressed", it === item);
  if (it.emoji) b.textContent = it.emoji;
  else {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    c.style.width = c.style.height = "30px";
    drawShape(c.getContext("2d"), it, 64, PALETTE[1]);
    b.appendChild(c);
  }
  b.onclick = () => {
    item = it;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    imgCache.clear();
    kick();
    if (act && act.itemChanged) act.itemChanged();
    else if (act && act.render && act.tpl) act.render(act.done ? $("prompt").querySelector(".row")?.outerHTML || "" : "");
  };
  $("chips").appendChild(b);
}
$("speak").onchange = () => { if (!$("speak").checked) stopSpeaking(); };

// Taps on the board go to the current activity.
canvas.addEventListener("click", e => {
  if (!act || !act.tap) return;
  const r = canvas.getBoundingClientRect();
  act.tap(e.clientX - r.left, e.clientY - r.top);
});

new ResizeObserver(() => { if (resizeCanvas() && act && act.layout) { act.layout(false); kick(); } }).observe(wrap);

// Decorations: floating bubbles and a rainbow title.
document.querySelectorAll(".sky").forEach(sky => {
  for (let i = 0; i < 14; i++) {
    const b = document.createElement("span");
    const size = 30 + Math.random() * 90;
    b.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;background:${pick(CONFETTI)};` +
      `animation-duration:${14 + Math.random() * 16}s;animation-delay:${-Math.random() * 30}s`;
    sky.appendChild(b);
  }
});
const RAINBOW = ["#ff4f8b", "#ff8a3d", "#f5b400", "#20c997", "#2fb8ff", "#7c4dff", "#d84dff"];
$("homeTitle").innerHTML = [..."Count With Me"].map((ch, i) =>
  ch === " " ? "&nbsp;" : `<span style="color:${RAINBOW[i % RAINBOW.length]};animation-delay:${i * .12}s">${ch}</span>`).join("");
document.querySelectorAll(".card").forEach((c, i) => { c.style.animationDelay = `${i * 60}ms`; });
if (document.fonts) document.fonts.ready.then(kick);

openActivity("count");
$("home").hidden = false;
</script>
</body>
</html>
