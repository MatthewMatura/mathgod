<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count With Me</title>
<style>
  :root {
    --bg: #fff8ec;
    --panel: #ffffff;
    --ink: #2b2a33;
    --muted: #6b6878;
    --accent: #ff7a59;
    --accent-ink: #ffffff;
    --frame: #fde7c8;
    --frame-line: #f3c98f;
    --chip: #f4efe6;
    --chip-on: #2b2a33;
    --counted: #7bd389;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1c24;
      --panel: #2a2933;
      --ink: #f4f2fa;
      --muted: #aaa6bb;
      --frame: #34323f;
      --frame-line: #4a475a;
      --chip: #34323f;
      --chip-on: #ffd36e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    display: flex;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  aside {
    width: 250px;
    flex: none;
    background: var(--panel);
    box-shadow: 2px 0 10px rgba(0,0,0,.06);
    padding: 16px 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 2;
  }
  h1 { margin: 0; font-size: 22px; text-align: center; }
  h2 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #num {
    width: 100%;
    font-size: 44px;
    font-weight: bold;
    text-align: center;
    padding: 4px 6px;
    border: 3px solid var(--frame-line);
    border-radius: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: inherit;
  }
  #num:focus { outline: none; border-color: var(--accent); }
  #num::-webkit-inner-spin-button, #num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #num { -moz-appearance: textfield; }
  .steps { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .step {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 32px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1;
  }
  .step:active, .chip:active, .grp:active { transform: scale(.92); }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
  .chip {
    font-size: 28px;
    height: 52px;
    border-radius: 14px;
    border: none;
    background: var(--chip);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .chip[aria-pressed="true"] { background: var(--chip-on); box-shadow: 0 0 0 3px var(--accent); }
  .groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grp {
    height: 46px;
    border-radius: 12px;
    border: none;
    background: var(--chip);
    color: var(--ink);
    font-family: inherit;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
  }
  .grp.mix { grid-column: 1 / -1; font-size: 18px; }
  .grp[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .grp.move { width: 100%; font-size: 18px; }
  .speed { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 20px; }
  .speed input { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 17px; color: var(--muted); cursor: pointer; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

  /* ---------- Board ---------- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .status {
    flex: none;
    text-align: center;
    padding: 12px 16px;
    font-size: 22px;
  }
  .status b { color: var(--accent); }
  .status .tapped { color: var(--muted); font-size: 18px; }
  #wrap { flex: 1; min-height: 0; position: relative; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }

  /* Phones: slimmer sidebar */
  @media (max-width: 600px) {
    aside { width: 132px; padding: 12px 8px; gap: 14px; }
    h1 { font-size: 16px; }
    h2 { font-size: 11px; }
    #num { font-size: 26px; border-radius: 12px; padding: 4px 2px; }
    .step { width: 46px; height: 46px; font-size: 26px; }
    .steps { gap: 8px; }
    .chips { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .chip { height: 48px; font-size: 26px; }
    .groups { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .grp { height: 42px; font-size: 18px; }
    .grp.mix { font-size: 15px; }
    .toggle { font-size: 14px; }
    .grp.move { font-size: 15px; }
    .speed { font-size: 15px; gap: 2px; }
    .status { font-size: 17px; padding: 10px 8px; }
  }
</style>
</head>
<body>
<aside>
  <h1>Count With Me</h1>
  <section>
    <h2><label for="num">Number</label></h2>
    <input id="num" type="number" inputmode="numeric" min="0" max="10000" value="7">
    <div class="steps">
      <button class="step" id="minus" aria-label="One less">−</button>
      <button class="step" id="plus" aria-label="One more">+</button>
    </div>
  </section>
  <section>
    <h2>Things</h2>
    <div class="chips" id="chips" role="group" aria-label="Choose what to count"></div>
  </section>
  <section>
    <h2>Make groups of</h2>
    <div class="groups" id="groups" role="group" aria-label="Arrange"></div>
  </section>
  <section>
    <h2>Move</h2>
    <button class="grp move" id="move" aria-pressed="false">▶ Move</button>
    <div class="speed">
      <span aria-hidden="true">🐢</span>
      <input type="range" id="speed" min="1" max="10" value="4" aria-label="Speed">
      <span aria-hidden="true">🐇</span>
    </div>
  </section>
  <label class="toggle"><input type="checkbox" id="speak"> Count out loud</label>
</aside>
<main id="main">
  <div class="status" id="status"></div>
  <div id="wrap"><canvas id="board" aria-label="Counting board"></canvas></div>
</main>
<script src="app.js"></script>
</body>
</html>
